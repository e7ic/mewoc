<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- 仅传给样例渲染进程；不安装字体、不修改系统或用户的字体偏好。 -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <cachedir>/private/tmp/mewoc-m7-font-cache</cachedir>
  <alias><family>sans-serif</family><prefer><family>Arial</family><family>Heiti SC</family></prefer></alias>
  <alias><family>PingFang SC</family><prefer><family>Heiti SC</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Menlo</family></prefer></alias>
</fontconfig>
